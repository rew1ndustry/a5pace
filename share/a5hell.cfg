# a5hell colours and thresholds. one "name value" a line; a missing file means these defaults.
# the map colours a cell green below green_below_db, red above red_above_db, yellow between (rms, dB).
green_below_db -24
red_above_db -6
# paint a black background on the whole screen (a program cannot change the terminal's own); 0 leaves it alone
paint_background 1
# 1: normal intensity and dimmed grey (a5hell --dim does the same for one run)
dim 0
# ANSI foreground codes: 37 grey (not 90, which vanishes on some themes), 91 bright red, 92 bright green, 93 bright yellow
col_text 37
col_live 91
col_safe 92
col_low 92
col_mid 93
col_high 91
